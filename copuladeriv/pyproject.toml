[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "copuladeriv"
version = "0.1.0"
description = "Quantitative derivatives pricing engine with copula models"
dependencies = [
    "numpy",
    "scipy",
    "pytest",
    "matplotlib",
]

[project.scripts]
copuladeriv = "copuladeriv.python.cli:main"