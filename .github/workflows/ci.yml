name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pytest streamlit plotly pandas ruff
      - name: Lint (ruff)
        run: |
          ruff check copuladeriv/app.py copuladeriv/studio_core.py copuladeriv/python/copuladeriv --select E9,F63,F7,F82,F401 --line-length 100
      - name: Run test suite
        run: |
          cd copuladeriv/python
          python -m pytest copuladeriv/tests/ -q
      - name: Application import smoke test
        run: |
          python -c "import ast; ast.parse(open('copuladeriv/app.py', encoding='utf-8').read()); print('app.py parses OK')"

  cpp-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make cmake
      - name: Configure (CMake fallback)
        run: |
          cmake -S copuladeriv/cpp -B copuladeriv/cpp/build -DCMAKE_BUILD_TYPE=Release || echo "CMake configure skipped; using direct g++"
      - name: Build C++20 engine
        run: |
          if [ -f copuladeriv/cpp/build/CMakeCache.txt ]; then
            cmake --build copuladeriv/cpp/build --config Release
          else
            g++ -std=c++20 -O3 -I copuladeriv/cpp/include -o copuladeriv/cpp/build/copuladeriv copuladeriv/cpp/src/copula.cpp copuladeriv/cpp/src/random.cpp copuladeriv/cpp/src/pricing.cpp copuladeriv/cpp/src/payoffs.cpp copuladeriv/cpp/src/main.cpp
          fi
      - name: Smoke-run engine binary
        run: |
          if [ -f copuladeriv/cpp/build/copuladeriv ]; then
            echo "Engine built; attempting smoke run (skip if PE/Windows binary)"
            ./copuladeriv/cpp/build/copuladeriv --help || true
          else
            echo "Engine binary not runnable in CI"
          fi
        continue-on-error: true
